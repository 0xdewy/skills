name: Validate skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Parse sources
        run: python3 scripts/check_sources.py
      - name: Validate contracts
        run: python3 scripts/validate_skills.py
      - name: Check volatile references
        run: python3 scripts/check_domain_freshness.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Plan behavior evals
        run: python3 scripts/run_evals.py --all --dry-run
      - name: Plan outcome ablation
        run: python3 scripts/run_ablation.py --skill invariant-miner --id 3 --dry-run
      - name: Plan routing evals
        run: python3 scripts/run_routing_evals.py --dry-run
      - name: Confirm checks are read-only
        run: git diff --exit-code
