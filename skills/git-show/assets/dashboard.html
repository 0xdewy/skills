<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git Show · Work in view</title>
<style>
:root{color-scheme:dark;--bg:#101719;--panel:#172124;--line:#344347;--text:#edf3ed;--muted:#a6b7b8;--green:#b9e68d;--red:#ffaaaa;--amber:#efce8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:40px}header{display:flex;justify-content:space-between;gap:25px;align-items:start}.eyebrow{color:var(--green);letter-spacing:.18em;font-size:11px;font-weight:700;text-transform:uppercase}h1{font-size:42px;font-weight:550;letter-spacing:-.05em;margin:7px 0}p{margin:6px 0;color:var(--muted)}.stamp{font:12px/1.8 ui-monospace,monospace;text-align:right;color:var(--muted)}.metrics{display:flex;gap:1px;margin:30px 0 22px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line)}.metric{flex:1;background:var(--panel);padding:18px 22px}.metric strong{font-size:28px;font-weight:500;display:block}.metric span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}input,button{border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);padding:9px 13px;font:inherit}input{flex:1;min-width:220px}button{cursor:pointer}button[aria-pressed=true]{background:var(--green);color:#172124;border-color:var(--green)}:focus-visible{outline:2px solid var(--green);outline-offset:3px}.repo{border:1px solid var(--line);border-radius:10px;margin:18px 0;overflow:hidden;background:var(--panel)}.repo>summary{padding:18px 22px;cursor:pointer;background:#1c292c;font-size:17px}.repo>summary small{color:var(--muted);font-size:12px;margin-left:16px}.tree{padding:12px 22px 22px;overflow-x:auto}.children{margin-left:14px;padding-left:20px;border-left:1px solid var(--line)}.node{position:relative;min-width:640px}.children>.node:before{content:'';position:absolute;left:-20px;top:23px;width:16px;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:minmax(250px,1fr) 108px minmax(230px,.8fr);gap:16px;align-items:start;padding:12px 8px;border-bottom:1px solid #273639}.name{font-weight:550}.number{color:var(--muted);font:12px ui-monospace,monospace;margin-right:9px}.delta{font:12px/1.8 ui-monospace,monospace;text-align:right;white-space:nowrap}.plus{color:var(--green)}.minus{color:var(--red)}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}.signals{display:flex;gap:5px;flex-wrap:wrap}.badge{font-size:11px;padding:2px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}.bad{color:var(--red);background:#42292b;border-color:#6a4244}.warn{color:var(--amber);background:#3d3425;border-color:#615138}.good{color:var(--green);background:#293b2a;border-color:#486044}.dep{display:block;font-size:12px;color:var(--muted);margin-top:5px}.branch{color:var(--green);font:12px ui-monospace,monospace;padding:16px 8px 8px}.evidence{padding:0 8px 10px;font-size:12px;color:var(--muted)}.evidence summary{cursor:pointer;width:fit-content}.evidence p{margin:8px 0;max-width:900px;white-space:pre-wrap;overflow-wrap:anywhere}.local{padding:12px 22px;border-top:1px solid var(--line);font:12px/1.8 ui-monospace,monospace;color:var(--muted)}.notice{padding:12px 16px;border-left:2px solid var(--amber);background:#29291f;color:var(--amber);margin:14px 0}footer{color:var(--muted);font-size:12px;margin:24px 0}.node:target>.row{background:#314237}#empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:700px){main{padding:20px 12px}header{display:block}h1{font-size:32px}.stamp{text-align:left;margin-top:12px}.metric{padding:12px}.metric strong{font-size:23px}.repo>summary{padding:14px}.repo>summary small{display:block;margin-left:14px}.tree{padding:8px 12px}.metrics{flex-wrap:wrap}.metric{min-width:40%}}@media print{.toolbar{display:none}body{background:white;color:black}.repo,.metric{break-inside:avoid}}
.branch-path{font:12px/1.7 ui-monospace,monospace;color:var(--green);overflow-wrap:anywhere;margin-top:6px}.branch-state{padding:10px 12px;margin:4px 8px 10px;border-left:2px solid var(--line);background:var(--bg);font-size:12px}.branch-state.warn{border-color:var(--amber)}.branch-state.bad{border-color:var(--red)}.branch-state p{margin:4px 0}.branch-state strong{color:var(--text)}.relationship{font-size:12px;color:var(--muted);margin-top:5px}.legend{font-size:12px}.dep small{display:block}a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
</style>
<main>
<header><div><div class="eyebrow">Git Show / Repository atlas</div><h1>Work in view.</h1><p id="scope"></p></div><div class="stamp" id="stamp"></div></header>
<div id="notices"></div><section class="metrics" id="metrics" aria-label="Snapshot totals"></section>
<div class="toolbar"><input id="search" type="search" placeholder="Find a repository, branch, PR, or author…" aria-label="Search work"><button data-filter="all" aria-pressed="true">All work</button><button data-filter="bad" aria-pressed="false">Blocked</button><button data-filter="warn" aria-pressed="false">Needs attention</button><button data-filter="branch" aria-pressed="false">Branch attention</button><button data-filter="dependencies" aria-pressed="false">Dependencies</button><button data-filter="draft" aria-pressed="false">Drafts</button></div>
<p class="legend">Tree lines = PR base relationships · ↗ = declared dependency · Ahead/behind compares captured head and base commits · Updating a parent can affect its descendants</p>
<p id="results" aria-live="polite"></p><div id="repos"></div><div id="empty" hidden>No matching work in this snapshot.</div><footer id="coverage"></footer>
</main>

{"scope":"bloom / engineering \u00b7 SYNTHETIC PREVIEW","collectedAt":"2026-09-09T18:00:00Z","coverage":"Illustrative data inspired by the supplied tree. No live repositories queried.","gaps":["DEMO \u00b7 Statuses below are synthetic. Readiness has not been verified."],"repos":[{"name":"bloom","summary":"Platform & runtime","local":["Local work example \u00b7 feat/solana-native \u00b7 staged 2 \u00b7 unstaged 1 \u00b7 upstream freshness unknown"],"nodes":[{"id":"b-main","kind":"branch","title":"master"},{"id":"b253","kind":"pr","number":253,"title":"petal pin","parent":"b-main","additions":4,"deletions":4,"signals":[{"label":"CI passed","tone":"good"},{"label":"readiness unverified","tone":"neutral"}],"head":"feature/253","base":"master","branchState":{"ahead":3,"behind":0,"mergeable":"UNKNOWN"}},{"id":"b222","kind":"pr","number":222,"title":"EVM deploy","parent":"b-main","additions":4964,"deletions":173,"signals":[{"label":"Draft","tone":"neutral"}],"dependencies":[{"label":"declared dependency \u00b7 broker#36","target":"br36"}],"head":"feature/222","base":"master","branchState":{"ahead":3,"behind":0,"mergeable":"UNKNOWN"}},{"id":"b224","kind":"pr","number":224,"title":"Safe semantic review","parent":"b222","additions":173,"deletions":15,"signals":[{"label":"Draft","tone":"neutral"}],"head":"feature/224","base":"feature/222","branchState":{"ahead":3,"behind":0,"mergeable":"UNKNOWN"}},{"id":"b170","kind":"pr","number":170,"title":"feat/solana-native","parent":"b-main","additions":17854,"deletions":980,"files":92,"signals":[{"label":"CI failed","tone":"bad"}],"details":[{"label":"CI \u00b7 synthetic example","text":"Integration suite failed. Confirm failure at the latest head before taking action."}],"head":"feature/170","base":"master","branchState":{"ahead":12,"behind":4,"mergeable":"MERGEABLE"}},{"id":"b250","kind":"pr","number":250,"title":"drop account-allocate CLI","parent":"b170","additions":95,"deletions":249,"signals":[{"label":"Awaiting base","tone":"warn <script>
'use strict';
const data=JSON.parse(document.getElementById('snapshot').textContent);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const safeURL=value=>{try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
const ids=new Map();let counter=0;for(const r of data.repos)for(const n of r.nodes)ids.set(n.id,'node-'+counter++);
const link=(label,url,target)=>{const href=ids.has(target)?'#'+ids.get(target):safeURL(url);const a=el(href?'a':'span','',label);if(href)a.href=href;return a};
const prs=data.repos.flatMap(r=>r.nodes).filter(n=>n.kind==='pr');
const allNodes=new Map(data.repos.flatMap(r=>r.nodes).map(n=>[n.id,n]));
function branchView(n){
 const b=n.branchState||{};
 const compared=Number.isInteger(b.ahead)&&Number.isInteger(b.behind)&&b.ahead>=0&&b.behind>=0;
 const divergence=compared?`${b.ahead} ahead · ${b.behind} behind base`:'Ahead/behind unknown';
 const parent=allNodes.get(n.parent);
 const stacked=parent?.kind==='pr';
 let label,tone,action;
 if(b.mergeable==='CONFLICTING'){label='Conflicts with base';tone='bad';action='Resolve conflicts against the base; rebase or merge according to repository policy.'}
 else if(compared&&b.behind>0){label='Base has newer commits';tone='warn';action='Review a rebase or merge from the base. Being behind alone does not require a rebase.'}
 else if(compared){label='Contains captured base';tone='neutral';action='No base update indicated by this comparison. This does not establish merge readiness.'}
 else{label='Branch comparison unknown';tone='warn';action='Compare the captured head and base before deciding whether to rebase.'}
 if(stacked)action+=' Update the parent first, then recheck this child against the new parent head.';
 return {divergence,label,tone,action,stacked};
}
const signals=n=>n.kind==='pr'?[...(n.signals||[]),{label:branchView(n).label,tone:branchView(n).tone}]:(n.signals||[]);
function descendants(id){const result=[];const visit=parent=>{for(const n of prs)if(n.parent===parent&&!result.includes(n)){result.push(n);visit(n.id)}};visit(id);return result}
const dependents=id=>prs.filter(n=>(n.dependencies||[]).some(d=>d.target===id));
function depState(d,target){return ({OPEN:'Target: open PR',MERGED:'Target: merged · integration not verified',CLOSED:'Target: closed without merge · review dependency'})[d.state]||(target?'Target: open PR in this snapshot':'Target state unverified')}
function branchPanel(n){
 const view=branchView(n),b=n.branchState||{};
 const panel=el('div','branch-state '+view.tone);
 panel.append(el('strong','',view.divergence+' · '+view.label),el('p','',view.action));
 if(b.error)panel.append(el('p','',b.error));
 if(b.headOid||b.baseOid){const evidence=el('p');evidence.append(link(`Compare ${b.baseOid?.slice(0,8)||'?'} → ${b.headOid?.slice(0,8)||'?'}`,b.url));panel.append(evidence)}
 const downstream=descendants(n.id), waiting=dependents(n.id);
 if(downstream.length){const p=el('p','impact','After updating this branch, recheck '+downstream.length+' descendant(s): ');downstream.forEach((child,i)=>{if(i)p.append(', ');p.append(link('#'+child.number,child.url,child.id))});panel.append(p)}
 if(waiting.length){const p=el('p','impact','Declared dependents: ');waiting.forEach((child,i)=>{if(i)p.append(', ');p.append(link('#'+child.number+' '+child.title,child.url,child.id))});panel.append(p)}
 return panel;
}
document.getElementById('scope').textContent=data.scope;
document.getElementById('stamp').textContent='STATIC SNAPSHOT · '+data.collectedAt;
document.getElementById('coverage').textContent=data.coverage+' · Counts reflect collected data. Local divergence uses local tracking refs.';
for(const gap of data.gaps||[])document.getElementById('notices').append(el('div','notice',gap));
for(const [label,num] of [['Repositories',data.repos.length],['Open PRs',prs.length],['PRs with blockers',prs.filter(n=>signals(n).some(s=>s.tone==='bad')).length],['PRs needing attention',prs.filter(n=>signals(n).some(s=>s.tone==='warn')).length]]){const m=el('div','metric');m.append(el('strong','',num),el('span','',label));document.getElementById('metrics').append(m)}
let filter='all';
function render(){const q=document.getElementById('search').value.toLowerCase();const container=document.getElementById('repos');container.replaceChildren();let shown=0;
for(const repo of data.repos){const children=new Map();for(const n of repo.nodes){const p=n.parent||null;if(!children.has(p))children.set(p,[]);children.get(p).push(n)}
const matches=n=>(repo.name+' '+JSON.stringify(n)).toLowerCase().includes(q)&&(filter==='all'||(filter==='branch'?n.kind==='pr'&&branchView(n).tone!=='neutral':filter==='dependencies'?(n.dependencies||[]).length>0||dependents(n.id).length>0:signals(n).some(s=>filter==='draft'?s.label.toLowerCase().includes('draft'):s.tone===filter)));
const visible=new Set();const keep=(n,path=new Set())=>{if(path.has(n.id))return false;const next=new Set(path).add(n.id);const below=(children.get(n.id)||[]).map(c=>keep(c,next)).some(Boolean);if(matches(n)||below){visible.add(n.id);return true}return false};
for(const n of children.get(null)||[])keep(n);
const localMatch=filter==='all'&&((repo.local||[]).join(' ')+' '+repo.name).toLowerCase().includes(q);
if(!visible.size&&!localMatch)continue;
const card=el('details','repo');card.open=repo.nodes.some(n=>n.kind==='pr')||Boolean(repo.local?.length);const heading=el('summary','',repo.name);heading.append(el('small','',repo.summary||`${repo.nodes.filter(n=>n.kind==='pr').length} open PRs`));card.append(heading);const tree=el('div','tree');
function draw(n){if(!visible.has(n.id))return null;const node=el('div','node');node.id=ids.get(n.id);
if(n.kind==='branch'){node.append(el('div','branch','⑂ '+n.title))}else{shown++;const row=el('div','row');const name=el('div','name');name.append(el('span','number','#'+n.number),link(n.title,n.url));name.append(el('div','branch-path',`${n.headRepo?n.headRepo+':':''}${n.head||'head unknown'} → ${n.baseRepo?n.baseRepo+':':''}${n.base||'base unknown'}`));const parent=allNodes.get(n.parent);if(parent?.kind==='pr'){const rel=el('div','relationship','Based on ');rel.append(link('#'+parent.number+' '+(parent.head||parent.title),parent.url,parent.id));name.append(rel)}for(const d of n.dependencies||[]){const dep=el('div','dep');dep.append(link('↗ '+d.label,d.url,d.target));const target=allNodes.get(d.target);dep.append(el('small','',depState(d,target)));if(d.error)dep.append(el('small','',d.error));if(d.evidence){const source=el('small');source.append(link('Source: '+d.evidence,d.evidenceUrl));dep.append(source)}name.append(dep)}const delta=el('div','delta');delta.append(el('span','plus',n.additions==null?'?':'+'+n.additions),document.createTextNode(' / '),el('span','minus',n.deletions==null?'?':'−'+n.deletions));const states=el('div','signals');for(const s of signals(n))states.append(el('span','badge '+(['bad','warn','good'].includes(s.tone)?s.tone:''),s.label));row.append(name,delta,states);node.append(row,branchPanel(n));
const details=el('details','evidence');details.append(el('summary','','Details & evidence'));details.append(el('p','',`${n.head||'head unknown'} → ${n.base||'base unknown'} · @${n.author||'unknown'} · ${n.files??'?'} files`));details.append(el('p','',`Created ${n.createdAt||'unknown'} · Updated ${n.updatedAt||'unknown'}`));for(const d of n.details||[]){const p=el('p');p.append(link(d.label,d.url),document.createTextNode(': '+d.text));details.append(p)}node.append(details)}
const descendants=el('div','children');for(const c of children.get(n.id)||[]){const child=draw(c);if(child)descendants.append(child)}if(descendants.childElementCount)node.append(descendants);return node}
for(const n of children.get(null)||[]){const node=draw(n);if(node)tree.append(node)}card.append(tree);if(repo.local?.length)card.append(el('div','local',repo.local.join(' · ')));container.append(card)}
document.getElementById('empty').hidden=container.childElementCount>0;document.getElementById('results').textContent=`${shown} PRs visible, including ancestor context`}
document.getElementById('search').addEventListener('input',render);
for(const b of document.querySelectorAll('[data-filter]'))b.addEventListener('click',()=>{filter=b.dataset.filter;for(const x of document.querySelectorAll('[data-filter]'))x.setAttribute('aria-pressed',String(x===b));render()});
document.addEventListener('click',event=>{const a=event.target.closest('a');if(!a||!a.getAttribute('href')?.startsWith('#node-'))return;event.preventDefault();filter='all';document.getElementById('search').value='';for(const b of document.querySelectorAll('[data-filter]'))b.setAttribute('aria-pressed',String(b.dataset.filter==='all'));render();const target=document.getElementById(a.hash.slice(1));if(target){for(let p=target.parentElement;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;location.hash=a.hash;target.scrollIntoView({block:'center'})}});
render();
</script>
